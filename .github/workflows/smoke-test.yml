name: Android smoke test

# Installs the app on an Android emulator, launches it, and records whether it
# survives, plus the crash log and a screenshot. Results are committed to the
# `smoke-logs` branch so they can be read through the GitHub API.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Same release build as the shipped APK, but for the emulator's CPU.
      - name: Build release APK (x86_64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/smoke.sh android/app/build/outputs/apk/release/app-release.apk smoke-out

      - name: Publish results to smoke-logs branch
        if: always()
        run: |
          mkdir -p smoke-out
          git config user.name "smoke-test"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin smoke-logs || true
          git worktree add -B smoke-logs ../logs origin/smoke-logs 2>/dev/null || git worktree add --orphan -b smoke-logs ../logs
          rm -rf ../logs/latest && cp -r smoke-out ../logs/latest
          echo "${GITHUB_SHA}" > ../logs/latest/commit.txt
          cd ../logs && git add -A && git commit -m "Smoke test for ${GITHUB_SHA::7}" && git push origin smoke-logs
