name: Android APK

# Builds an installable APK on every push to main (or on demand) and publishes
# it as the "latest" GitHub Release, so it can be downloaded straight to a phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # arm64 only: every phone from the last several years, and a much faster build.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk union-hub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: union-hub-apk
          path: union-hub.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest union-hub.apk \
            --title "Union Hub (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download union-hub.apk on your Android phone and open it to install (allow installs from your browser if asked)." \
            --target "$GITHUB_SHA"
